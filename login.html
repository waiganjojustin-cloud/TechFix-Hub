<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechFix Hub | Technician Login</title>
    <link rel="stylesheet" href="./styles.css">
</head>

<body>

<header>
    <h1>📱 TechFix Hub</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="repair.html">Add Repair</a>
    </nav>
</header>

<main class="login-page">

    <div class="login-card">

        <h2>🔒 Technician Login</h2>

        <p>Please sign in to access the Technician Portal.</p>

        <form id="loginForm">

            <input
                type="text"
                id="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

            <p id="message"></p>

        </form>

    </div>

</main>

<footer>
    <p>&copy; 2026 TechFix Hub</p>
</footer>

<script src="./login.js"></script>

</body>
</html>
