<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechFix Hub | Technician Portal</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <header>

        <h1>📱 TechFix Hub</h1>

        <nav>

            <a href="index.html">Home</a>

            <a href="repair.html">Add Repair</a>

            <a href="technician.html" class="active">Technician Portal</a>

        </nav>

    </header>

    <main>

        <section class="dashboard">

            <h2>Technician Dashboard</h2>

            <p>
                View all repair requests, update their status, or remove completed repairs.
            </p>

            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Search customer or device...">
            
            </div>

            <table id="repairTable">

                <thead>

                    <tr>

                        <th>No.</th>

                        <th>Customer</th>

                        <th>Phone</th>

                        <th>Device</th>

                        <th>Problem</th>

                        <th>Status</th>

                        <th>Payment</th>

                        <th>M-Pesa No.</th>

                        <th>Actions</th>

                    </tr>

                </thead>

                <!-- JavaScript will insert repair records here -->
                <tbody id="repairList">

                </tbody>

            </table>

        </section>

    </main>

    <footer>

        <p>
            © 2026 TechFix Hub | Built with intent
        </p>

    </footer>

    <script src="./technician.js"></script>
</body>
</html>
