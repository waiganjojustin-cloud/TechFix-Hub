<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechFix Hub | Add Repair</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <header>

        <h1>📱 TechFix Hub</h1>

        <nav id="navbar">

            <a href="index.html">Home</a>

            <a href="repair.html" class="active">Add Repair</a>

            <a href="login.html>Technician Portal</a>

        </nav>

    </header>

    <main>

        <section class="form-container">

            <h2>Submit a Repair Request</h2>

            <form id="repairForm">

                <label for="customerName">Customer Name</label>

                <input
                    type="text"
                    id="customerName"
                    placeholder="Enter your full name"
                    required
                >

                <label for="phoneNumber">Phone Number</label>

                <input
                    type="tel"
                    id="phoneNumber"
                    placeholder="e.g. 0712345678"
                    required
                >

                <label for="deviceType">Device Type</label>

                <select id="deviceType" required>

                    <option value="">Select Device</option>

                    <option>Phone</option>

                    <option>Laptop</option>

                    <option>Tablet</option>

                    <option>Desktop Computer</option>

                    <option>Smart Watch</option>

                </select>

                <label for="problem">Problem Description</label>

                <textarea
                    id="problem"
                    rows="5"
                    placeholder="Describe the problem..."
                    required
                ></textarea>
                <label for="status">Repair Status</label>

                <select id="status">

                    <option>Pending</option>

                    <option>Completed</option>

                </select>

                <label for="paymentMethod">Payment Method</label>
                
                <select id="paymentMethod" required>
                    
                    <option value="">Select Payment Method</option>
                    
                    <option>Cash</option>
                    
                    <option>M-Pesa</option>
                    
                    <option>Debit Card</option>
                    
                    <option>Credit Card</option>
                    
                    <option>Bank Transfer</option>
                
                </select>
                
                <div id="mpesaSection">
                    
                    <label for="paymentNumber">M-Pesa Phone Number</label>
                    
                    <input type="tel" id="paymentNumber" placeholder="e.g. 0712345678">
                
                </div>
                
                <div class="buttons">

                    <button type="submit">
                        Save Repair
                    </button>

                    <button type="reset">
                        Clear Form
                    </button>

                </div>

            </form>

        </section>

    </main>

    <footer>

        <p>
            © 2026 TechFix Hub | Built with intent
        </p>

    </footer>

    <script src="./repair.js"></script>

</body>
</html>
